<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090B10"/>
      <stop offset="1" stop-color="#141824"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#EF4444" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Icon Shell -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="8 4" stroke-opacity="0.8"/>
  
  <!-- Stylized 404 Glyphs -->
  <text x="32" y="39" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="21" text-anchor="middle" letter-spacing="-1.2">404</text>
  
  <!-- Active Danger Dot -->
  <circle cx="50" cy="14" r="4.5" fill="#EF4444" filter="url(#glow)"/>
  <circle cx="50" cy="14" r="2" fill="#FFFFFF"/>
</svg>
