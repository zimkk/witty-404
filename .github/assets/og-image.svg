<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="640" fill="#0B0E14"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#161B26" stroke-width="1"/>
    </pattern>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#grid)" />

  <!-- Left: Branding & Tagline -->
  <g transform="translate(80, 180)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#161F30" stroke="#253550" stroke-width="1"/>
    <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle" letter-spacing="1.5">OPEN SOURCE</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="url(#titleGrad)" letter-spacing="-2">witty-404</text>

    <!-- Subtitle -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
      Witty 404 error pages &amp; developer jokes API
    </text>

    <!-- Badges / Stack -->
    <g transform="translate(0, 190)">
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#64748B">
        <tspan fill="#38BDF8">⚡ Cloudflare Workers</tspan>
        <tspan fill="#475569">   •   </tspan>
        <tspan fill="#A78BFA">📦 Zero Runtime Deps</tspan>
        <tspan fill="#475569">   •   </tspan>
        <tspan fill="#34D399">🎭 5 Themes</tspan>
      </text>
    </g>
  </g>

  <!-- Right: Code Terminal Window -->
  <g transform="translate(680, 120)">
    <!-- Card Container -->
    <rect width="520" height="400" rx="14" fill="#0E121A" stroke="#202738" stroke-width="1.5"/>
    <rect width="520" height="40" rx="14" fill="#141A24"/>
    <path d="M 0 26 L 0 40 L 520 40 L 520 26 Z" fill="#141A24"/>
    <line x1="0" y1="40" x2="520" y2="40" stroke="#202738" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="24" cy="20" r="5.5" fill="#EF4444"/>
    <circle cx="42" cy="20" r="5.5" fill="#F59E0B"/>
    <circle cx="60" cy="20" r="5.5" fill="#10B981"/>

    <text x="260" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748B" text-anchor="middle">404-handler.ts</text>

    <!-- Terminal Content -->
    <g transform="translate(32, 85)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14.5">
      <text y="0" fill="#94A3B8">$ <tspan fill="#38BDF8">curl</tspan> -I https://api.prod/v1/missing</text>
      <text y="36" fill="#F87171" font-weight="700">HTTP/2 404 Not Found</text>
      
      <text y="80" fill="#64748B">// Error: Dave pushed to main on Friday 5:58 PM</text>
      <text y="112" fill="#FCD34D">"It worked on localhost:3000 five minutes ago."</text>

      <text y="160" fill="#94A3B8">$ <tspan fill="#38BDF8">git</tspan> blame -L 404,404 src/routes.ts</text>
      <text y="194" fill="#4ADE80">8f3c2a1 (dave 3y ago) // TODO: fix before launch</text>
      
      <text y="244" fill="#60A5FA" font-size="13">✓ Edge Latency: 3ms (iad1)</text>
    </g>
  </g>

  <!-- Footer Info -->
  <text x="80" y="580" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#475569">MIT License • Built with TypeScript</text>
  <text x="1200" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748B" text-anchor="end">github.com/zimkk/witty-404</text>
</svg>
